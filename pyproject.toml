[project]
name = "comfyui-flux3-layoutkit"
description = "Small, strict FLUX 3 layout/bbox interoperability utilities for ComfyUI: 0-1 / 0-1000 conversion, strict validation of bbox / src_bbox / tgt_bbox / from rows, and parity tests against the official parser. Unofficial; not a bounding-box editor."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/hiroki-abe-58/ComfyUI-Flux3-LayoutKit"

[tool.comfy]
PublisherId = "hiroki-abe-58"
DisplayName = "FLUX 3 LayoutKit (unofficial)"
Icon = ""

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
